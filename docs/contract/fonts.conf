<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Homebrew の LibreOffice が macOS の日本語フォントを見つけられないため、探し先を足す -->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/AssetsV2</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir>~/.cache/fontconfig-contract</cachedir>
</fontconfig>
